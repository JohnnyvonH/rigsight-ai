name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: pip install -e ".[dev]"
      - name: Lint backend
        run: ruff check app
      - name: Test backend
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        run: npm install
      - name: Build frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker services
        run: docker compose build
      - name: Start Docker services
        run: docker compose up -d
      - name: Smoke backend API
        run: |
          curl --fail --retry 12 --retry-delay 5 --retry-all-errors http://localhost:8000/ready
          curl --fail http://localhost:8000/health
          curl --fail http://localhost:8000/runs
          curl --fail http://localhost:8000/readings/latest
          curl --fail http://localhost:8000/alerts
          curl --fail http://localhost:8000/camera/status
      - name: Smoke frontend
        run: curl --fail --retry 12 --retry-delay 5 --retry-all-errors http://localhost:5173
      - name: Stop Docker services
        if: always()
        run: docker compose down
